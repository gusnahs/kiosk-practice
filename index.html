function toast(message) {
  const el = $('#toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 2400);
}
function hideToast() {
  clearTimeout(toastTimer);
  $('#toast').classList.remove('show');
}

const rectOf = sel => { const el = $(sel); return el ? el.getBoundingClientRect() : null; };
function fly(svgMarkup, from, to) {
  if (!from || !to || reduceMotion() || !document.body.animate) return;
  const el = document.createElement('div');
  el.className = 'fly';
  el.innerHTML = svgMarkup;
  Object.assign(el.style, { left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px' });
  document.body.appendChild(el);
  const dx = to.left + to.width / 2 - (from.left + from.width / 2);
  const dy = to.top + to.height / 2 - (from.top + from.height / 2);
  el.animate(
    [{ transform: 'translate(0, 0) scale(1)', opacity: 1 }, { transform: `translate(${dx}px, ${dy}px) scale(.3)`, opacity: 0 }],
    { duration: 650, easing: 'cubic-bezier(.45, -0.15, .7, 1)', fill: 'forwards' }
  ).onfinish = () => el.remove();
  setTimeout(() => el.remove(), 900);
}

function showHelp() {
  if (app.view !== 'practice' || !state) return;
  const ex = missionExpect();
  const def = state.sheet ? SHEETS[state.sheet.type] : SCREENS[state.screen];
  const sel = def.help ? def.help(ex) : null;
  const el = sel && $('#kiosk').querySelector(sel);
  $$('.help-glow').forEach(e => e.classList.remove('help-glow'));
  if (!el || el.disabled) { toast(T('잠시 기다리거나 지금 할 일 안내를 따라 해 보세요')); return; }
  el.classList.add('help-glow');
  el.scrollIntoView({ block: 'nearest', behavior: reduceMotion() ? 'auto' : 'smooth' });
  toast(T('반짝이는 곳을 눌러 보세요'));
  if (app.sound) speak(T('반짝이는 곳을 눌러 보세요'));
}

/* =====================================================================
   13) 화면 이동
   ===================================================================== */
function freshState() {
  return {
    screen: firstScreen(),
    history: [],
    sheet: null,
    orderType: null,
    category: store ? store.categories[0].id : null,
    cart: [],
    upsellShown: false,
    upsellResult: null,
    pagerInput: { pager: '', field: 'pager' },
    pagerBuzz: false,
    boardReady: false,
    visit: null,
    consent: { required: false, sms: false },
    verify: { birth: '', phone: '', field: 'birth' },
    idc: { method: null, step: 'choose' },
    symptom: null,
    dept: null,
    ticketNum: null,
    callFront: 0,
    called: false,
    docs: {},
    installment: null,
    cert: null,
    certVisit: null,
    copies: 1,
    payStep: 'ready',
    orderNo: null,
  };
}

function clearTimers() {
  clearTimeout(payTimer);
  clearTimeout(boardTimer);
  clearTimeout(stepTimer);
}

function go(screen) {
  clearTimeout(stepTimer);
  state.history.push(state.screen);
  state.screen = screen;
  once.enter = 'forward';
  if (isFinal()) { state.history = []; finishPractice(); }
  render();
}
function goNext() {
  const f = P().flow;
  let i = f.findIndex(s => stepName(s) === state.screen) + 1;
  while (i < f.length - 1 && !stepOn(f[i])) i++;
  go(stepName(f[i]));
}

function finishPractice() {
  once.printAnim = true;
  if (store) {
    if (state.orderType === 'here' && store.pager) {
      boardTimer = setTimeout(() => { state.pagerBuzz = true; render(); }, 3500);
    } else if (store.pickup && store.pickup.type === 'board') {
      boardTimer = setTimeout(() => { state.boardReady = true; render(); }, 3500);
    }
  }
  if (state.screen === 'ticket') {
    const tick = () => {
      if (state.callFront > 0) {
        state.callFront -= 1;
        boardTimer = setTimeout(tick, 1300);
      } else {
        state.called = true;
      }
      render();
    };
    boardTimer = setTimeout(tick, 1600);
  }
  const m = currentMission();
  if (m) {
    const diffs = evaluateMission(m);
    const pass = diffs.length === 0;
    if (pass) { doneMissions.add(m.id); saveDone(); }
    state.sheet = { type: 'result', pass, diffs };
    once.sheetOpened = true;
    if (app.sound) setTimeout(() => speak(pass ? T('미션 성공! 잘하셨어요!') : msg('resultFail', fmtDiff(diffs[0]))), 50);
  }
}

function back() {
  if (state.sheet) { sheetBack(); return; }
  const screenBack = SCREENS[state.screen].back;
  if (screenBack && screenBack()) return;
  if (isLocked() || isFinal() || !state.history.length) return;
  clearTimeout(stepTimer);
  state.screen = state.history.pop();
  once.enter = 'back';
  render();
}

function restartPractice() {
  if (isLocked() && !isFinal()) return;
  clearTimers();
  state = freshState();
  once.enter = 'forward';
  render();
}

function openSheet(sheet) {
  hideToast();
  state.sheet = sheet;
  once.sheetOpened = true;
  render();
}
function sheetBack() {
  const sh = state.sheet;
  if (LOCKED_SHEETS.includes(sh.type)) return;
  if (sh.type === 'set' && sh.step !== 'type') { sh.step = SET_PREV[sh.step](sh); render(); return; }
  if (sh.type === 'discount' && sh.picked) { sh.picked = null; render(); return; }
  closeSheet();
}
function closeSheet() {
  const sh = state.sheet;
  if (!sh || LOCKED_SHEETS.includes(sh.type)) return;
  if (sh.type === 'upsell') state.upsellResult = sh.added ? 'added' : 'declined';
  state.sheet = null;
  render();
  if (sh.type === 'option' || sh.type === 'set') focusMenuCard(sh.itemId);
}
function focusMenuCard(itemId) {
  const card = $(`#screen [data-action="open-item"][data-arg="${itemId}"]`);
  if (card) card.focus({ preventScroll: true });
}

/* ----- 주문 동작 ----- */
function openItem(itemId) {
  const item = findItem(itemId);
  if (item.soldOut) { toast(T('품절된 메뉴예요. 다른 메뉴를 골라 주세요')); return; }
  if (item.setable && store.set) {
    openSheet({ type: 'set', itemId, step: 'type', set: null, custom: emptyCustom(), choices: {}, qty: 1, showInfo: false });
  } else {
    openSheet({ type: 'option', itemId, choices: defaultChoices(item), qty: 1, warn: null, showInfo: false });
  }
}

function scrollToGroup(groupId) {
  const el = $(`.opt-group[data-group="${groupId}"]`);
  if (el) el.scrollIntoView({ block: 'nearest', behavior: reduceMotion() ? 'auto' : 'smooth' });
}

function chooseOption(arg) {
  const [groupId, choiceId] = arg.split(':');
  const sh = state.sheet;
  const item = findItem(sh.itemId);
  const before = variantFor(item, sh.choices).temp + sh.choices.size;
  sh.choices[groupId] = choiceId;
  if (variantFor(item, sh.choices).temp + sh.choices.size !== before) once.artPop = true;
  render();
  const next = missingGroup();
  if (store.optionGroups[groupId].required && next) scrollToGroup(next);
}

function toggleIngredient(arg) {
  const [kind, id] = arg.split(':');
  const list = state.sheet.custom[kind];
  state.sheet.custom[kind] = list.includes(id) ? list.filter(x => x !== id) : [...list, id];
  once.artPop = true;
  render();
}

function addLine(item, choices, qty, set = null, custom = null) {
  const parts = [item.id, ...visibleGroups(item, choices).map(g => `${g}=${choices[g]}`)];
  if (set) parts.push(`set=${set.size}+${set.side}+${set.drink}+${set.ice}`);
  const cleanCustom = hasCustom(custom) ? { add: [...custom.add].sort(), remove: [...custom.remove].sort() } : null;
  if (cleanCustom) parts.push(`custom=${cleanCustom.add.join(',')}/${cleanCustom.remove.join(',')}`);
  const key = parts.join('|');
  let line = state.cart.find(l => l.key === key);
  if (!line) {
    line = { key, itemId: item.id, choices: { ...choices }, set: set ? { ...set } : null, custom: cleanCustom, qty: 0 };
    state.cart.push(line);
  }
  const added = Math.min(qty, MAX_QTY - line.qty);
  line.qty += added;
  if (!line.qty) state.cart = state.cart.filter(l => l !== line);
  return added;
}

function addFromSheet() {
  const sh = state.sheet;
  const item = findItem(sh.itemId);
  if (sh.type === 'option') {
    const miss = missingGroup();
    if (miss) {
      sh.warn = miss;
      render();
      sh.warn = null;
      scrollToGroup(miss);
      toast(msg('first', T(store.optionGroups[miss].guide)));
      return;
    }
  }
  const from = rectOf('.sheet .art-lg');
  const picture = artSVG(item, variantFor(item, sh.choices, sh.custom));
  const added = addLine(item, sh.choices, sh.qty, sh.set, sh.custom);
  state.sheet = null;
  once.bump = true;

  const u = store.upsell;
  const askUpsell = u && u.trigger === 'afterAdd' && !state.upsellShown && item.category === u.afterCategory && added > 0;
  if (askUpsell) {
    state.upsellShown = true;
    state.sheet = { type: 'upsell', added: 0 };
    once.sheetOpened = true;
  }
  render();
  fly(picture, from, rectOf('.summary'));
  if (askUpsell) return;
  focusMenuCard(item.id);
  if (added < sh.qty) toast(msg('maxQty', MAX_QTY));
  else toast(msg('added', T(item.name), added, T(unitOf(item))));
}

function checkout() {
  if (!cartCount()) { toast(T('먼저 메뉴를 하나 담아 주세요')); return; }
  const u = store.upsell;
  const hasCategory = u && state.cart.some(l => findItem(l.itemId).category === u.category);
  if (u && u.trigger === 'checkout' && !state.upsellShown && !hasCategory) {
    state.upsellShown = true;
    openSheet({ type: 'upsell', added: 0 });
    return;
  }
  goNext();
}

function upsellAdd(itemId) {
  const item = findItem(itemId);
  const from = rectOf(`.upsell-row[data-arg="${itemId}"] .row-art`);
  const added = addLine(item, defaultChoices(item), 1);
  if (!added) { toast(msg('maxQty', MAX_QTY)); return; }
  state.sheet.added += 1;
  once.bump = true;
  render();
  fly(artSVG(item), from, rectOf('.summary'));
}

function upsellDone() {
  state.upsellResult = state.sheet.added ? 'added' : 'declined';
  state.sheet = null;
  if (store.upsell.trigger === 'checkout') goNext();
  else render();
}

function changeQty(key, delta) {
  const line = state.cart.find(l => l.key === key);
  if (!line) return;
  line.qty = Math.min(MAX_QTY, Math.max(1, line.qty + delta));
  render();
}

function removeLine(key) {
  const line = state.cart.find(l => l.key === key);
  if (!line) return;
  state.cart = state.cart.filter(l => l !== line);
  render();
  toast(msg('removed', T(findItem(line.itemId).name)));
}

/* ----- 카드 결제 (공통) ----- */
function cardTap() {
  if (state.payStep === 'ready') {
    once.cardAnim = true;
    if (!store && P().hospital === 'payment') {
      state.payStep = 'inserted';
      openSheet({ type: 'installment' });
    } else {
      startPaying();
    }
  } else if (state.payStep === 'remove') {
    state.payStep = 'removed';
    render();
    payTimer = setTimeout(() => {
      state.payStep = 'out';
      if (store && store.receipt) openSheet({ type: 'receipt', printing: false });
      else goNext();
    }, 750);
  }
}
function startPaying() {
  state.payStep = 'paying';
  render();
  payTimer = setTimeout(() => {
    state.payStep = 'remove';
    state.orderNo = 100 + Math.floor(Math.random() * 800);
    render();
  }, PAY_DELAY);
}

/* ----- 병원 동작 ----- */
function hospitalMenu(id) {
  const task = P().hospital;
  if (id === task) { goNext(); return; }
  toast(msg('wrongTask', T(labelOf(HOSPITAL.menu, task))));
}
function consentToggle(id) {
  state.consent[id] = !state.consent[id];
  render();
}
function consentAll() {
  const all = !(state.consent.required && state.consent.sms);
  state.consent = { required: all, sms: all };
  render();
}
function consentNext() {
  if (!state.consent.required) {
    once.warn = true;
    render();
    toast(T('필수 항목에 동의해야 접수할 수 있어요'));
    return;
  }
  goNext();
}
function idPlace() {
  if (state.idc.step !== 'place') return;
  state.idc.step = 'scanning';
  once.placeAnim = true;
  render();
  stepTimer = setTimeout(() => { state.idc.step = 'done'; render(); }, 1600);
}
function chooseDoc(arg) {
  const [id, val] = arg.split(':');
  state.docs[id] = val === 'yes';
  render();
}
function docsNext() {
  if (HOSPITAL.docs.some(d => state.docs[d.id] === undefined)) {
    once.warn = true;
    render();
    toast(T('받을 서류를 모두 골라 주세요'));
    return;
  }
  goNext();
}
function chooseCert(id) {
  const c = HOSPITAL.certificates.find(x => x.id === id);
  if (c.counterOnly) { toast(msg('counterOnly', T(c.label))); return; }
  state.cert = id;
  goNext();
}

/* ----- 키오스크 안 버튼들 ----- */
const actions = {
  start: () => goNext(),
  'order-type': id => { state.orderType = id; goNext(); },
  tab: id => { state.category = id; render(); },
  promo: () => { const item = findItem(store.promo.itemId); state.category = item.category; openItem(item.id); },
  'open-item': id => openItem(id),
  'toggle-info': () => { state.sheet.showInfo = !state.sheet.showInfo; render(); },
  choose: arg => chooseOption(arg),
  'sheet-close': () => closeSheet(),
  'sheet-dec': () => { state.sheet.qty = Math.max(1, state.sheet.qty - 1); render(); },
  'sheet-inc': () => { state.sheet.qty = Math.min(MAX_QTY, state.sheet.qty + 1); render(); },
  'option-add': () => addFromSheet(),
  'set-type': kind => {
    const sh = state.sheet;
    sh.showInfo = false;
    if (kind === 'set') { sh.step = 'setSize'; sh.set = { size: null, side: null, drink: null, ice: null }; } else { sh.step = 'confirm'; sh.set = null; }
    render();
  },
  'set-size': id => { state.sheet.set.size = id; state.sheet.step = 'side'; render(); },
  'set-side': id => { state.sheet.set.side = id; state.sheet.step = 'drink'; render(); },
  'set-drink': id => { state.sheet.set.drink = id; state.sheet.step = 'ice'; render(); },
  'set-ice': id => { state.sheet.set.ice = id; state.sheet.step = 'confirm'; render(); },
  'set-custom': () => { state.sheet.step = 'custom'; render(); },
  ing: arg => toggleIngredient(arg),
  'custom-done': () => { state.sheet.step = 'confirm'; render(); },
  'set-add': () => addFromSheet(),
  checkout: () => checkout(),
  'upsell-add': id => upsellAdd(id),
  'upsell-done': () => upsellDone(),
  inc: key => changeQty(key, 1),
  dec: key => changeQty(key, -1),
  remove: key => removeLine(key),
  pay: () => {
    if (!cartCount()) return;
    if (store.discount) openSheet({ type: 'discount', picked: null });
    else goNext();
  },
  'discount-pick': id => { state.sheet.picked = id; render(); },
  'discount-done': () => { state.sheet = null; goNext(); },
  'pay-method': id => {
    if (id !== 'card') { toast(T("이번 연습에서는 '카드 결제'를 눌러 주세요")); return; }
    state.payStep = 'ready';
    goNext();
  },
  'insert-card': () => cardTap(),
  installment: id => { state.installment = id; state.sheet = null; startPaying(); },
  'receipt-skip': () => { state.sheet = null; goNext(); },
  'receipt-print': () => { state.sheet.printing = true; once.printAnim = true; render(); },
  'receipt-done': () => { state.sheet = null; goNext(); },
  field: id => { KEYPADS[state.screen].data().field = id; render(); },
  key: d => pressKey(d),
  'key-del': () => deleteKey(),
  'key-ok': () => confirmKey(),
  hmenu: id => hospitalMenu(id),
  visit: id => { state.visit = id; goNext(); },
  consent: id => consentToggle(id),
  'consent-all': () => consentAll(),
  'consent-next': () => consentNext(),
  'id-method': id => { state.idc = { method: id, step: 'place' }; render(); },
  'id-place': () => idPlace(),
  symptom: id => { state.symptom = id; goNext(); },
  dept: id => { state.dept = id; goNext(); },
  'confirm-reception': () => {
    const d = HOSPITAL.depts.find(x => x.id === state.dept);
    state.ticketNum = 10 + Math.floor(Math.random() * 20) + d.waiting;
    state.callFront = d.waiting;
    state.called = false;
    goNext();
  },
  next: () => goNext(),
  doc: arg => chooseDoc(arg),
  'docs-next': () => docsNext(),
  'open-paper': () => openSheet({ type: 'paper' }),
  cert: id => chooseCert(id),
  'cert-visit': id => { state.certVisit = id; goNext(); },
  'copies-dec': () => { state.copies = Math.max(1, state.copies - 1); render(); },
  'copies-inc': () => { state.copies = Math.min(HOSPITAL.maxCopies, state.copies + 1); render(); },
  'cert-confirm': () => goNext(),
  restart: () => restartPractice(),
  'mission-retry': () => restartPractice(),
  'mission-list': () => leavePractice('missions'),
  back: () => back(),
  home: () => restartPractice(),
};

/* =====================================================================
   14) 첫 화면 · 미션 목록 · 연습 시작
   ===================================================================== */
function renderHome() {
  $('#homeGrid').innerHTML = Object.entries(PRACTICES).map(([id, p]) => `
    <button class="home-card" data-app="practice" data-arg="${id}">
      <span class="home-emoji" aria-hidden="true">${p.emoji}</span><b>${E(p.title)}</b><span>${E(p.desc)}</span>
    </button>`).join('');
  $('#homeMissionCount').textContent = `${MISSIONS.filter(m => doneMissions.has(m.id)).length}/${MISSIONS.length}`;
}

function renderMissions() {
  const doneCount = MISSIONS.filter(m => doneMissions.has(m.id)).length;
  $('#missionProgress').textContent = msg('successCount', doneCount, MISSIONS.length);
  $('#missionList').innerHTML = Object.entries(PRACTICES).map(([pid, p]) => {
    const list = MISSIONS.filter(m => m.practice === pid);
    if (!list.length) return '';
    return `
      <section class="mission-group">
        <h2>${p.emoji} ${E(p.title)}</h2>
        <div class="mission-cards">
          ${list.map(m => {
            const ok = doneMissions.has(m.id);
            return `
            <button class="mission-card${ok ? ' done' : ''}" data-app="mission" data-arg="${m.id}" aria-label="${E(m.text)}${ok ? ', ' + E('성공함') : ''}">
              <span class="mission-card-text">${E(m.text)}</span>
              <span class="mission-card-state">${E(ok ? '✓ 성공' : '도전 →')}</span>
            </button>`;
          }).join('')}
        </div>
      </section>`;
  }).join('');
}

function updateSoundButtons() {
  const home = $('#homeSound');
  const mini = $('#miniSound');
  if (!speech.supported) {
    home.disabled = true;
    home.textContent = T('🔇 소리로 읽어 주기를 쓸 수 없어요');
    $('#soundNote').textContent = T('이 브라우저는 소리로 읽어 주기를 지원하지 않아요.');
    mini.hidden = true;
    $('#speakBtn').hidden = true;
    return;
  }
  home.setAttribute('aria-pressed', String(app.sound));
  home.textContent = T(app.sound ? '🔊 소리 켜짐 · 누르면 꺼져요' : '🔇 소리 꺼짐 · 누르면 켜져요');
  $('#soundNote').textContent = T(app.sound ? '화면이 바뀔 때마다 안내를 소리로 읽어 드려요.' : '소리를 켜면 화면이 바뀔 때마다 안내를 읽어 드려요.');
  mini.setAttribute('aria-pressed', String(app.sound));
  mini.textContent = T(app.sound ? '🔊 소리 켬' : '🔇 소리 끔');
  mini.setAttribute('aria-label', T(app.sound ? '안내 소리 끄기' : '안내 소리 켜기'));
}

function toggleSound() {
  if (!speech.supported) return;
  app.sound = !app.sound;
  updateSoundButtons();
  if (app.sound) speak(T('소리를 켰어요. 화면이 바뀔 때마다 안내를 읽어 드릴게요.'));
  else stopSpeaking();
}

function showView(view) {
  app.view = view;
  $('#homeView').hidden = view !== 'home';
  $('#missionView').hidden = view !== 'missions';
  $('#practiceView').hidden = view !== 'practice';
  if (view !== 'practice') { clearTimers(); hideToast(); }
  if (view === 'home') {
    renderHome();
    $('#homeView').scrollTop = 0;
    $('#homeTitle').focus({ preventScroll: true });
    if (app.sound) speak(T('무엇을 연습할지 골라 보세요'));
  }
  if (view === 'missions') {
    renderMissions();
    $('#missionView').scrollTop = 0;
    $('#missionTitle').focus({ preventScroll: true });
    if (app.sound) speak(T('해 보고 싶은 미션을 골라 보세요'));
  }
  updateSoundButtons();
}

function startPractice(practiceId, missionId = null) {
  clearTimers();
  app.practice = practiceId;
  app.mission = missionId;
  const p = P();
  store = p.store ? STORES[p.store] : null;
  const t = place().theme;
  const view = $('#practiceView');
  [['--brand', t.brand], ['--action', t.action], ['--action-press', t.press], ['--action-soft', t.soft], ['--pulse', t.pulse]]
    .forEach(([k, val]) => view.style.setProperty(k, val));
  document.documentElement.style.setProperty('--lang-accent', t.action);
  const m = currentMission();
  $('#missionBar').hidden = !m;
  view.classList.toggle('has-mission', !!m);
  renderPracticeHeader();
  state = freshState();
  $('#guideText').textContent = '';
  $('#screen').dataset.screen = '';
  showView('practice');
  render();
  $('#screen').focus({ preventScroll: true });
  if (app.sound) speak(m ? msg('missionSpeak', T(m.text), guideText()) : guideText());
}

function leavePractice(to) {
  clearTimers();
  stopSpeaking();
  const dest = to || (app.mission ? 'missions' : 'home');
  app.practice = null;
  app.mission = null;
  document.documentElement.style.removeProperty('--lang-accent');
  // 안내 페이지에서 바로 들어온 경우(?practice=cafe) 주소에서 지워 둠
  try {
    const url = new URL(location.href);
    if (url.searchParams.has('practice')) { url.searchParams.delete('practice'); history.replaceState(null, '', url); }
  } catch (e) { /* 주소를 못 바꿔도 화면은 바뀜 */ }
  showView(dest);
}

/* =====================================================================
   15) 언어 선택 — 사진 속 키오스크처럼 국기와 언어 이름을 보여 줌
   고른 언어는 주소 끝(?lang=en)에만 남기고 브라우저에는 저장하지 않음
   ===================================================================== */
function detectLang() {
  const asked = new URLSearchParams(location.search).get('lang');
  if (asked && LANGS.some(l => l.id === asked)) return asked;
  for (const raw of navigator.languages || [navigator.language || 'ko']) {
    const l = String(raw).toLowerCase();
    if (l.startsWith('ko')) return 'ko';
    if (l.startsWith('en')) return 'en';
    if (l.startsWith('ja')) return 'ja';
    if (/^zh-(tw|hk|mo|hant)/.test(l)) return 'zh-Hant';
    if (l.startsWith('zh')) return 'zh-Hans';
  }
  return 'ko';
}

function applyStatic() {
  document.documentElement.lang = lang;
  document.title = T('한국 키오스크 연습');
  $$('[data-t]').forEach(el => { el.textContent = T(el.dataset.t); });
  $$('[data-th]').forEach(el => { el.innerHTML = T(el.dataset.th); });
  $$('[data-ta]').forEach(el => { el.setAttribute('aria-label', T(el.dataset.ta)); });
  const keepLang = lang !== 'ko' || new URLSearchParams(location.search).has('lang');
  $$('a[data-page]').forEach(a => { a.href = a.dataset.page + (keepLang ? `?lang=${lang}` : ''); });
  $$('a[data-guide]').forEach(a => { a.href = curLang().guide; });
  $$('.lang-flag').forEach(el => { el.innerHTML = flagSVG(curLang().flag); });
  $$('.lang-cur').forEach(el => { el.textContent = curLang().name; });
  $$('.lang-code').forEach(el => { el.textContent = curLang().code; });
  $$('.lang-btn').forEach(el => { el.setAttribute('aria-label', `${T('언어 선택')} · Language: ${curLang().name}`); });
}

function renderLangGrid() {
  $('#langGrid').innerHTML = LANGS.map(l => `
    <button class="lang-tile${l.id === lang ? ' on' : ''}" data-app="lang" data-arg="${l.id}" lang="${l.id}" aria-pressed="${l.id === lang}">
      ${l.id === lang ? '<span class="lang-check" aria-hidden="true">✓</span>' : ''}
      <span class="flag lg">${flagSVG(l.flag)}</span><span>${l.name}</span>
    </button>`).join('');
}

let langReturnFocus = null;
function openLang() {
  langReturnFocus = document.activeElement;
  renderLangGrid();
  $('#langPopup').hidden = false;
  const on = $('#langGrid .lang-tile.on');
  if (on) on.focus({ preventScroll: true });
}
function closeLang() {
  $('#langPopup').hidden = true;
  if (langReturnFocus && document.contains(langReturnFocus)) langReturnFocus.focus({ preventScroll: true });
}

function setLang(id) {
  if (!LANGS.some(l => l.id === id)) return;
  lang = id;
  try {
    const url = new URL(location.href);
    url.searchParams.set('lang', id);
    history.replaceState(null, '', url);
  } catch (e) { /* 주소를 못 바꿔도 화면은 바뀜 */ }
  applyStatic();
  updateSoundButtons();
  hideToast();
  $('#toast').textContent = '';
  if (app.view === 'home') renderHome();
  if (app.view === 'missions') renderMissions();
  if (app.view === 'practice' && state) { renderPracticeHeader(); render(); }
  closeLang();
  if (app.sound) speak(msg('langChanged'));
}

/* =====================================================================
   16) 버튼 연결
   ===================================================================== */
const APP_ACTIONS = {
  home: () => showView('home'),
  missions: () => showView('missions'),
  practice: id => startPractice(id),
  mission: id => { const m = MISSIONS.find(x => x.id === id); if (m) startPractice(m.practice, m.id); },
  leave: () => leavePractice(),
  sound: () => toggleSound(),
  speak: () => { if (state) speak(guideText()); },
  help: () => showHelp(),
  'lang-open': () => openLang(),
  'lang-close': () => closeLang(),
  lang: id => setLang(id),
};

document.addEventListener('click', e => {
  const appBtn = e.target.closest('[data-app]');
  if (appBtn && !appBtn.disabled) {
    const fn = APP_ACTIONS[appBtn.dataset.app];
    if (fn) fn(appBtn.dataset.arg);
    return;
  }
  if (e.target.id === 'langPopup') { closeLang(); return; }
  const el = e.target.closest('#kiosk [data-action]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.action];
  if (fn) fn(el.dataset.arg);
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#langPopup').hidden) { closeLang(); return; }
  if (app.view === 'practice' && state && state.sheet) sheetBack();
});

lang = detectLang();
applyStatic();
if (speech.supported && 'onvoiceschanged' in window.speechSynthesis) window.speechSynthesis.onvoiceschanged = () => {};
showView('home');
// 안내 페이지의 '직접 해 보기' 버튼: ?practice=cafe 처럼 들어오면 그 연습을 바로 시작
const directPractice = new URLSearchParams(location.search).get('practice');
if (directPractice && PRACTICES[directPractice]) startPractice(directPractice);
</script>
</body>
</html>
