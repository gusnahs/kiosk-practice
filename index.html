<meta property="og:description" content="카페·햄버거 주문, 병원 접수·수납·증명서 발급 키오스크를 미리 눌러 보며 연습해 보세요. English · 日本語 · 中文 지원. 실제로 결제되지 않아요.">

<style>
  :root {
    color-scheme: light;
    --page: #EEE8E1;
    --ink: #1C1917;
    --muted: #57534E;
    --line: #E4DDD4;
    --soft: #F7F3EE;
    --bezel: #2A2725;
    --guide-bg: #FFE27A;
    --guide-line: #E2BC3C;
    --off-bg: #DAD5CF;
    --off-ink: #57534E;
    --focus: #2563EB;
    --mission: #4338CA;
    --mission-soft: #EEF0FF;
    --ok: #15803D;
    /* 가게·병원마다 바뀌는 색 (연습을 시작할 때 덮어씀) */
    --brand: #6F4E37;
    --action: #C2410C;
    --action-press: #9A3412;
    --action-soft: #FFF1E6;
    --pulse: 194, 65, 12;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
    font-size: 20px;
    line-height: 1.4;
    word-break: keep-all;
    overflow-wrap: anywhere;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  /* 언어별 글꼴과 줄바꿈 (중국어·일본어는 글자 사이에서 줄을 바꿔야 함) */
  html:lang(en) body { word-break: normal; }
  /* 한국어보다 긴 번역은 팝업 아래 버튼에서 두 줄로 내려가게 */
  html:not(:lang(ko)) .sheet-foot .btn { white-space: normal; }
  html:lang(ja) body { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji"; }
  html:lang(zh-Hans) body { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji"; }
  html:lang(zh-Hant) body { font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji"; }
  html:lang(ja) body, html:lang(zh-Hans) body, html:lang(zh-Hant) body { word-break: normal; line-break: strict; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-user-select: none; user-select: none; }
  button:focus-visible, [tabindex]:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
  #screen:focus, h1:focus { outline: none; }
  h1, h2, h3, h4, p, dl, dd { margin: 0; }
  svg { display: block; width: 100%; height: 100%; }
  [hidden] { display: none !important; }

  .app {
    height: 100vh;
    height: 100dvh;
    padding: 16px;
    display: flex;
    justify-content: center;
    container-type: size;
  }

  /* ================= 첫 화면 · 미션 목록 ================= */
  .page {
    width: min(100%, 720px);
    height: 100%;
    overflow-y: auto;
    padding: 4px 4px 28px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .page > * { flex-shrink: 0; }
  .page-head { text-align: center; padding: 2px 0 2px; }
  .page-emoji { font-size: 48px; line-height: 1; }
  .page h1 { font-size: 34px; font-weight: 900; line-height: 1.25; }
  .page-head p, .page-sub { font-size: 21px; color: var(--muted); }
  .page-h2 { font-size: 24px; font-weight: 800; }
  .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .home-card {
    min-height: 176px;
    padding: 16px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: #fff;
    border: 3px solid var(--line);
    border-radius: 22px;
    text-align: center;
  }
  .home-card:last-child:nth-child(odd) { grid-column: 1 / -1; min-height: 150px; }
  .home-card:active { border-color: var(--ink); }
  .home-emoji { font-size: 60px; line-height: 1; }
  .home-card b { font-size: 26px; font-weight: 900; line-height: 1.25; }
  .home-card span:last-child { font-size: 20px; color: var(--muted); }
  .mission-entry { min-height: 96px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; background: var(--mission); border: none; border-radius: 22px; color: #fff; text-align: left; }
  .me-emoji { font-size: 44px; line-height: 1; }
  .me-text { flex: 1; display: flex; flex-direction: column; }
  .me-text b { font-size: 27px; font-weight: 900; }
  .me-text span { font-size: 20px; opacity: .92; }
  .me-count { flex: none; padding: 4px 12px; border-radius: 999px; background: rgba(255, 255, 255, .2); font-size: 20px; font-weight: 800; }
  .sound-toggle { min-height: 72px; padding: 10px 18px; background: #fff; border: 3px solid var(--line); border-radius: 18px; font-size: 23px; font-weight: 800; }
  .sound-toggle[aria-pressed="true"] { background: #ECFDF3; border-color: var(--ok); color: #14532D; }
  .sound-toggle:disabled { opacity: .5; cursor: default; }
  .page-note { font-size: 20px; color: var(--muted); text-align: center; }
  .page-links { margin-top: 4px; padding-top: 12px; border-top: 2px solid var(--line); text-align: center; }
  .page-links a { display: inline-block; min-height: 48px; padding: 10px 14px; color: var(--muted); font-size: 20px; text-underline-offset: 4px; }
  .page-links a:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; border-radius: 8px; }

  .page-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .home-top { justify-content: flex-end; }
  .mission-progress { font-size: 22px; font-weight: 800; color: var(--mission); }
  .mission-group { display: flex; flex-direction: column; gap: 10px; }
  .mission-group h2 { font-size: 25px; font-weight: 900; padding-top: 6px; }
  .mission-cards { display: flex; flex-direction: column; gap: 10px; }
  .mission-card { min-height: 84px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; background: #fff; border: 3px solid var(--line); border-radius: 18px; text-align: left; }
  .mission-card:active { border-color: var(--mission); }
  .mission-card-text { flex: 1; font-size: 22px; font-weight: 700; }
  .mission-card-state { flex: none; padding: 6px 12px; border-radius: 12px; background: var(--mission-soft); color: var(--mission); font-size: 20px; font-weight: 800; white-space: nowrap; }
  .mission-card.done { border-color: #86C99B; background: #F3FBF5; }
  .mission-card.done .mission-card-state { background: var(--ok); color: #fff; }

  .top-btn { flex: none; min-height: 50px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 2px solid #CFC7BD; border-radius: 14px; font-size: 20px; font-weight: 800; white-space: nowrap; }
  .sound-mini[aria-pressed="true"] { background: #ECFDF3; border-color: var(--ok); color: #14532D; }

  /* ---------- 국기 · 언어 선택 ---------- */
  .flag { display: block; flex: none; border: 1px solid #CFC7BD; border-radius: 4px; overflow: hidden; background: #fff; }
  .flag svg { display: block; width: 100%; height: 100%; }
  .flag.sm { width: 30px; height: 20px; }
  .flag.lg { width: 76px; height: 51px; }
  .lang-backdrop { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(28, 25, 23, .6); }
  .lang-panel { width: min(100%, 580px); max-height: 100%; overflow-y: auto; padding: 24px 18px 20px; background: #fff; border: 5px solid var(--lang-accent, #C2410C); border-radius: 26px; text-align: center; box-shadow: 0 18px 40px rgba(0, 0, 0, .25); }
  .lang-panel h2 { font-size: 30px; font-weight: 900; line-height: 1.3; }
  .lang-sub { margin-top: 2px; font-size: 20px; color: var(--muted); }
  .lang-grid { margin-top: 18px; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 12px; }
  .lang-tile { position: relative; width: calc((100% - 24px) / 3); min-height: 128px; padding: 14px 6px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: #fff; border: 3px solid var(--line); border-radius: 16px; font-size: 22px; font-weight: 800; line-height: 1.2; }
  .lang-tile:active { background: #FFF7F2; }
  .lang-tile.on { border-color: var(--lang-accent, #C2410C); background: #FFF7F2; }
  .lang-check { position: absolute; top: -13px; left: -11px; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: var(--lang-accent, #C2410C); color: #fff; font-size: 20px; font-weight: 900; }
  .lang-close { margin-top: 20px; width: min(100%, 300px); min-height: 62px; background: #fff; border: 2px solid #A8A29E; border-radius: 999px; font-size: 23px; font-weight: 800; }
  .kiosk-lang { flex: none; min-height: 54px; padding: 0 18px; display: inline-flex; align-items: center; gap: 10px; background: #fff; border: 2px solid #CFC7BD; border-radius: 999px; font-size: 20px; font-weight: 800; }

  /* ================= 연습 화면 ================= */
  .stage { width: min(100%, 680px); height: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  /* 가운데 정렬하되, 화면이 작아 넘치면 위에서부터 보이게 */
  .stage > :first-child { margin-top: auto; }
  .stage > :last-child { margin-bottom: auto; }
  .topbar { flex: none; width: 100%; display: flex; align-items: center; gap: 10px; }
  .top-title { flex: 1; min-width: 0; text-align: center; font-size: 22px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .guide { flex: none; width: 100%; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 12px 12px 12px 18px; background: var(--guide-bg); border: 3px solid var(--guide-line); border-radius: 18px; }
  .guide-label { display: inline-block; margin-right: 8px; padding: 0 10px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 20px; font-weight: 700; line-height: 1.6; vertical-align: 3px; white-space: nowrap; }
  .guide-text { font-size: clamp(21px, 5.4vw, 28px); font-weight: 800; line-height: 1.3; }
  .guide.flash { animation: flash .7s ease-out; }
  @keyframes flash { 0% { transform: scale(1.03); background: #FFF5C7; } 100% { transform: none; } }
  .speak-btn { min-width: 64px; min-height: 60px; padding: 4px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; border: 2px solid var(--guide-line); border-radius: 14px; font-size: 20px; font-weight: 800; line-height: 1.1; }
  .speak-btn span { font-size: 24px; }

  .mission-bar { flex: none; width: 100%; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; background: var(--mission-soft); border: 3px solid #A5B0F5; border-radius: 18px; }
  .mission-info { font-size: 21px; font-weight: 800; line-height: 1.35; }
  .mission-label { display: inline-block; margin-right: 4px; padding: 0 10px; border-radius: 8px; background: var(--mission); color: #fff; font-size: 20px; font-weight: 800; }
  .help-btn { min-height: 60px; padding: 0 16px; display: flex; align-items: center; gap: 4px; background: var(--mission); border: none; border-radius: 14px; color: #fff; font-size: 21px; font-weight: 800; white-space: nowrap; }

  .kiosk {
    flex: 1 0 auto;
    height: 0;
    min-height: 470px;
    max-height: 1000px;
    width: 100%;
    width: min(100%, max(380px, calc((100cqh - 190px) * 0.62)), 560px);
    display: flex;
    flex-direction: column;
    background: #fff;
    border: 12px solid var(--bezel);
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 14px 34px rgba(40, 25, 10, .22);
  }
  .has-mission .kiosk { width: min(100%, max(380px, calc((100cqh - 280px) * 0.66)), 560px); }
  .kiosk-top { flex: none; min-height: 54px; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--brand); color: #fff; }
  .store { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 800; line-height: 1.2; }
  .logo { flex: none; width: 34px; height: 34px; padding: 2px; display: grid; place-items: center; background: #fff; border-radius: 50%; font-size: 20px; }
  .badge { flex: none; padding: 3px 14px; border-radius: 999px; background: #fff; color: var(--brand); font-size: 20px; font-weight: 800; white-space: nowrap; }
  .screen-area { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  #screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .screen.center { overflow-y: auto; padding: 20px 18px; }
  .center-inner { margin: auto 0; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
  .scroll-body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .title { font-size: 28px; font-weight: 800; line-height: 1.3; }
  .title.pad { flex: none; padding: 16px 16px 8px; }
  .sub { font-size: 21px; color: var(--muted); }
  .sub.left { text-align: left; }
  .note { font-size: 20px; color: var(--muted); }
  .enter { animation: enter .28s ease-out; }
  .enter-back { animation: enterBack .28s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateX(28px); } }
  @keyframes enterBack { from { opacity: 0; transform: translateX(-28px); } }
  .kiosk-nav { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px 12px; background: #F1EBE4; border-top: 2px solid var(--line); }

  /* ---------- 버튼 ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 60px; padding: 0 20px; border: none; border-radius: 14px; font-size: 22px; font-weight: 800; line-height: 1.2; }
  .btn-primary { background: var(--action); color: #fff; }
  .btn-primary:active { background: var(--action-press); }
  .btn-secondary { background: #fff; border: 2px solid #CFC7BD; }
  .btn.is-off { background: var(--off-bg); color: var(--off-ink); }
  .btn.big { width: 100%; min-height: 70px; font-size: 24px; }
  .btn-nav { width: 100%; min-height: 58px; background: #fff; border: 2px solid #CFC7BD; font-size: 21px; white-space: nowrap; }
  .btn-nav:disabled { opacity: .4; cursor: default; }
  .hint { animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(var(--pulse), .6); }
    70% { box-shadow: 0 0 0 12px rgba(var(--pulse), 0); }
    100% { box-shadow: 0 0 0 0 rgba(var(--pulse), 0); }
  }
  .help-glow { position: relative; z-index: 4; outline: 5px solid #FACC15 !important; outline-offset: 3px; animation: helpGlow 1s ease-in-out infinite !important; }
  .card.help-glow, .scan-item.help-glow { z-index: 1; }
  @keyframes helpGlow { 50% { box-shadow: 0 0 0 12px rgba(250, 204, 21, .55); } }

  /* ---------- 주문: 시작·매장/포장 ---------- */
  .start-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; background: #FBF6F0; padding-bottom: 14px; overflow-y: auto; }
  .start-screen { flex: 1; width: 100%; border: none; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px 24px 10px; text-align: center; }
  .start-art { width: 128px; height: 128px; }
  .start-name { font-size: 40px; font-weight: 900; color: var(--brand); line-height: 1.2; }
  .start-msg { font-size: 30px; font-weight: 800; line-height: 1.35; }
  .start-finger { font-size: 56px; line-height: 1; animation: tap 1.4s ease-in-out infinite; }
  @keyframes tap { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  .start-note { padding: 8px 14px; border: 2px solid var(--line); border-radius: 12px; background: #fff; font-size: 20px; color: var(--muted); }
  .where-grid { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .where-btn { min-height: 200px; padding: 16px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #fff; border: 3px solid var(--line); border-radius: 20px; font-size: 24px; font-weight: 800; line-height: 1.25; }
  .where-btn:active { background: var(--action-soft); border-color: var(--action); }
  .where-emoji { font-size: 64px; line-height: 1; }

  /* ---------- 주문: 메뉴 ---------- */
  .promo { flex: none; margin: 10px 12px 0; min-height: 56px; padding: 8px 14px; display: flex; align-items: center; gap: 10px; background: linear-gradient(90deg, #FFF4E5, #FFE6D5); border: 2px solid #F3A97A; border-radius: 14px; font-size: 20px; font-weight: 800; text-align: left; line-height: 1.3; }
  .promo-badge { flex: none; padding: 0 8px; border-radius: 8px; background: var(--action); color: #fff; }
  .promo-arrow { margin-left: auto; color: var(--action); }
  .tabs { flex: none; display: grid; grid-auto-columns: 1fr; grid-auto-flow: column; gap: 8px; padding: 12px 12px 10px; border-bottom: 2px solid var(--line); }
  .tab { min-height: 58px; padding: 4px; border-radius: 14px; background: var(--soft); border: 2px solid var(--line); font-size: 22px; font-weight: 800; line-height: 1.1; }
  .tab[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
  .menu-grid { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start; gap: 12px; padding: 14px 12px; }
  .menu-card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 8px 14px; background: #fff; border: 2px solid var(--line); border-radius: 18px; }
  .menu-card:active { background: var(--action-soft); border-color: var(--action); }
  .menu-art { width: 96px; height: 96px; padding: 6px; background: var(--soft); border-radius: 50%; }
  .menu-name { font-size: 21px; font-weight: 800; line-height: 1.25; text-align: center; }
  .menu-price { font-size: 20px; font-weight: 600; color: var(--muted); }
  .tag, .in-cart { position: absolute; top: 8px; padding: 1px 10px; border-radius: 999px; color: #fff; font-size: 18px; font-weight: 800; }
  .tag { left: 8px; }
  .in-cart { right: 8px; background: var(--action); }
  .menu-card.sold .menu-art, .menu-card.sold .menu-name, .menu-card.sold .menu-price, .menu-card.sold .tag { opacity: .4; }
  .menu-card.sold .menu-price { text-decoration: line-through; }
  .sold-label { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); padding: 4px 18px; border-radius: 10px; background: rgba(28, 25, 23, .88); color: #fff; font-size: 21px; font-weight: 900; white-space: nowrap; }
  .art-emoji { display: grid; place-items: center; width: 100%; height: 100%; font-size: 48px; line-height: 1; }
  .summary, .cart-foot { flex: none; display: flex; align-items: center; gap: 12px; padding: 12px; background: #FBF8F4; border-top: 2px solid var(--line); }
  .summary.bump { animation: bump .7s ease-out; }
  @keyframes bump { 0% { background: var(--action-soft); } 100% { background: #FBF8F4; } }
  .summary-text { flex: 1; min-width: 0; }
  .summary-items { font-size: 20px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .summary-total { font-size: 23px; font-weight: 900; }
  .pay-btn { flex: none; min-width: 136px; min-height: 66px; font-size: 23px; }
  .fly { position: fixed; z-index: 50; pointer-events: none; }

  /* ---------- 팝업 창 ---------- */
  .sheet-backdrop { position: absolute; inset: 0; z-index: 5; display: flex; align-items: flex-end; background: rgba(28, 25, 23, .55); }
  .sheet { width: 100%; max-height: 100%; display: flex; flex-direction: column; background: #fff; border-radius: 24px 24px 0 0; overflow: hidden; }
  .sheet-backdrop.opening { animation: fade .2s ease-out; }
  .sheet-backdrop.opening .sheet { animation: rise .25s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(40px); } }
  .sheet-body { overflow-y: auto; padding: 18px 16px 12px; display: flex; flex-direction: column; gap: 16px; }
  .sheet-body.center-text { align-items: center; text-align: center; }
  .sheet-head { display: flex; align-items: center; gap: 14px; }
  .sheet-head-text { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .art-lg { flex: none; width: 96px; height: 96px; padding: 6px; background: var(--soft); border-radius: 50%; }
  .art-lg.small { width: 60px; height: 60px; padding: 4px; }
  .art-lg svg { transform: scale(var(--s, 1)); transition: transform .25s ease-out; }
  .art-lg.pop svg { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(calc(var(--s, 1) * .8)); } }
  .sheet-title { font-size: 26px; font-weight: 900; line-height: 1.25; }
  .sheet-price { font-size: 20px; color: var(--muted); }
  .sheet-sub { font-size: 21px; color: var(--muted); }
  .sheet-text { font-size: 22px; }
  .sheet-help { font-size: 20px; color: var(--muted); }
  .item-desc { font-size: 20px; color: var(--action); font-weight: 700; }
  .info-emoji { font-size: 60px; line-height: 1; }
  .info-btn { margin-top: 4px; min-height: 44px; padding: 0 12px; background: #fff; border: 2px solid #CFC7BD; border-radius: 12px; font-size: 20px; font-weight: 700; }
  .info-btn[aria-expanded="true"] { background: var(--soft); }
  .info-box { padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; background: var(--soft); border-radius: 14px; font-size: 20px; }
  .info-box dt { font-weight: 800; }
  .info-box .info-note { grid-column: 1 / -1; color: var(--muted); }
  .sheet-foot { flex: none; display: grid; grid-template-columns: 1fr 2fr; gap: 10px; padding: 12px 16px 16px; border-top: 2px solid var(--line); }
  .sheet-foot.one { grid-template-columns: 1fr; }
  .sheet-foot.two { grid-template-columns: 1fr 1fr; }
  .sheet-foot .btn { min-height: 66px; padding: 0 12px; white-space: nowrap; }

  .req, .opt-tag { display: inline-block; padding: 0 9px; border-radius: 8px; font-size: 18px; font-weight: 800; line-height: 1.5; }
  .req { background: var(--action); color: #fff; }
  .opt-tag { background: #E7E1DA; color: var(--muted); }
  .opt-group { min-width: 0; margin: 0; padding: 12px; border: none; border-radius: 16px; background: var(--soft); scroll-margin: 12px; }
  .opt-group legend { float: left; width: 100%; padding: 0; margin-bottom: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
  .opt-title { font-size: 22px; font-weight: 800; }
  .opt-hint { width: 100%; font-size: 20px; color: var(--muted); }
  .opt-group.next { box-shadow: inset 0 0 0 3px var(--action); }
  .warn { animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .opt-choices { clear: both; display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 10px; }
  .opt { position: relative; min-height: 64px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: #fff; border: 3px solid var(--line); border-radius: 14px; }
  .opt-icon { width: 54px; height: 54px; }
  .opt-icon svg { transform: scale(var(--s, 1)); }
  .opt-emoji { font-size: 30px; line-height: 1.1; }
  .opt-label { font-size: 21px; font-weight: 800; line-height: 1.2; text-align: center; }
  .opt-price { font-size: 20px; font-weight: 700; color: var(--action); }
  .opt.selected { background: var(--action-soft); border-color: var(--action); }
  .opt-check { position: absolute; top: -10px; right: -6px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--action); color: #fff; font-size: 18px; font-weight: 900; }
  .no-option { padding: 14px; border-radius: 14px; background: var(--soft); font-size: 21px; color: var(--muted); }
  .qty-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 16px; background: var(--soft); }
  .qty-label { font-size: 22px; font-weight: 800; }

  .upsell-list, .pick-list { display: flex; flex-direction: column; gap: 10px; }
  .upsell-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: #fff; border: 2px solid var(--line); border-radius: 16px; text-align: left; }
  .upsell-row.added { background: var(--action-soft); border-color: var(--action); }
  .upsell-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .upsell-price { font-size: 20px; color: var(--muted); }
  .upsell-add { flex: none; padding: 8px 14px; border: 2px solid var(--action); border-radius: 12px; background: var(--action); color: #fff; font-size: 20px; font-weight: 800; white-space: nowrap; }
  .upsell-row.added .upsell-add { background: #fff; color: var(--action); }

  .choice-list { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .choice-card { min-height: 84px; padding: 10px 16px; display: flex; align-items: center; gap: 14px; background: #fff; border: 3px solid var(--line); border-radius: 18px; text-align: left; }
  .choice-card:active { background: var(--action-soft); border-color: var(--action); }
  .choice-card.counter-only { background: var(--soft); }
  .choice-card.counter-only .choice-text { opacity: .7; }
  .choice-emoji { font-size: 40px; line-height: 1; }
  .size-emoji { flex: none; width: 48px; text-align: center; }
  .choice-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .choice-text b { font-size: 24px; line-height: 1.25; }
  .choice-text span { font-size: 20px; color: var(--muted); }
  .choice-text .fee { font-style: normal; font-weight: 800; color: var(--action); }
  .counter-only .choice-text .fee { color: var(--muted); }
  .fee-tag { flex: none; padding: 4px 10px; border-radius: 10px; background: var(--soft); font-size: 20px; font-weight: 800; white-space: nowrap; }

  /* 버거 세트·재료 */
  .set-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .set-card { min-height: 200px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: #fff; border: 3px solid var(--line); border-radius: 18px; text-align: center; }
  .set-card:active { background: var(--action-soft); border-color: var(--action); }
  .set-card b { font-size: 27px; font-weight: 900; }
  .set-card span { font-size: 20px; color: var(--muted); }
  .set-card .set-price { color: var(--ink); font-weight: 800; }
  .set-card s { color: var(--muted); font-weight: 400; }
  .set-art { width: 76px; height: 76px; }
  .set-art.combo { width: auto; display: flex; }
  .set-art.combo span { width: 56px; height: 76px; margin: 0 -6px; }
  .step-label { font-size: 20px; font-weight: 800; color: var(--action); }
  .set-summary { padding: 14px; border-radius: 16px; background: var(--soft); text-align: center; display: flex; flex-direction: column; }
  .set-summary b { font-size: 24px; }
  .set-summary span { font-size: 21px; color: var(--muted); }
  .custom-btn { min-height: 60px; padding: 6px 10px; background: #fff; border: 2px dashed var(--action); border-radius: 14px; color: var(--action); font-size: 21px; font-weight: 800; }

  /* 영수증·번호표·서류 */
  .printer { width: min(100%, 300px); }
  .printer.wide { width: min(100%, 380px); }
  .printer-slot { height: 18px; border-radius: 9px; background: var(--bezel); box-shadow: inset 0 -5px 0 #000; }
  .paper-clip { margin: -6px 14px 0; padding-bottom: 10px; overflow: hidden; }
  .paper { padding: 14px 14px 16px; background: #fff; border: 1px solid var(--line); border-top: none; box-shadow: 0 6px 10px rgba(0, 0, 0, .08); text-align: left; font-size: 18px; line-height: 1.5; }
  .paper.copies { box-shadow: 5px 5px 0 -1px #fff, 5px 5px 0 0 var(--line), 0 6px 10px rgba(0, 0, 0, .08); }
  .paper.printing { animation: print 1.6s cubic-bezier(.3, .7, .4, 1); }
  @keyframes print { from { transform: translateY(-100%); } }
  .r-store { font-size: 22px; font-weight: 900; text-align: center; }
  .r-line { text-align: center; color: var(--muted); }
  .r-sep { margin: 8px 0; border-top: 2px dashed #CFC7BD; }
  .r-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 10px; }
  .r-row > :last-child { margin-left: auto; }
  .r-total { font-size: 20px; font-weight: 900; }
  .r-note { margin-top: 8px; text-align: center; color: var(--muted); }
  .r-big { font-size: 54px; font-weight: 900; line-height: 1.1; text-align: center; letter-spacing: 2px; color: var(--brand); }
  .r-stamp { margin-top: 8px; text-align: right; font-weight: 800; }
  .r-stamp span { display: inline-block; margin-left: 6px; padding: 0 6px; border: 2px solid #C2410C; border-radius: 6px; color: #C2410C; transform: rotate(-8deg); }
  .slips { width: 100%; display: flex; justify-content: center; gap: 10px; }
  .slip-col { flex: 1; max-width: 190px; }
  .slip-col .paper-clip { margin: -6px 8px 0; }
  .slip-col .paper { padding: 10px; }
  .copies-note { font-size: 20px; font-weight: 800; color: var(--brand); }

  /* 처방전 */
  .rx-title { font-size: 26px; font-weight: 900; letter-spacing: 6px; text-align: center; }
  html:not(:lang(ko)) .rx-title { letter-spacing: 1px; }
  .rx-sub { text-align: center; color: var(--muted); }
  .rx table { width: 100%; margin-top: 6px; border-collapse: collapse; }
  .rx th, .rx td { padding: 4px 6px; border: 1px solid #CFC7BD; text-align: left; vertical-align: top; }
  .rx th { background: var(--soft); font-weight: 800; white-space: nowrap; }
  .rx-h { margin-top: 10px; font-weight: 900; }
  .rx-drugs th:not(:first-child), .rx-drugs td:not(:first-child) { text-align: center; }
  .rx-drugs th:not(:first-child) { white-space: nowrap; }
  .rx-note { margin-top: 6px; color: var(--muted); }
  .open-paper { min-height: 56px; padding: 0 16px; background: #fff; border: 2px solid var(--brand); border-radius: 14px; color: var(--brand); font-size: 21px; font-weight: 800; }

  /* 결과 */
  .mission-quote { width: 100%; padding: 10px 14px; border-radius: 14px; background: var(--mission-soft); color: var(--mission); font-size: 21px; font-weight: 800; }
  .diff-list { width: 100%; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; text-align: left; }
  .diff-list li { position: relative; padding: 10px 14px 10px 44px; border-radius: 14px; background: #FEF3F2; font-size: 21px; }
  .diff-list li::before { content: '✗'; position: absolute; left: 14px; top: 9px; color: #B42318; font-weight: 900; }

  /* ---------- 장바구니 ---------- */
  .cart-list { flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 8px 12px 14px; list-style: none; display: flex; flex-direction: column; gap: 12px; }
  .cart-row { padding: 12px; background: #fff; border: 2px solid var(--line); border-radius: 18px; }
  .row-head { display: flex; align-items: center; gap: 12px; }
  .row-art { flex: none; width: 60px; height: 60px; padding: 4px; background: var(--soft); border-radius: 50%; }
  .row-info { flex: 1; min-width: 0; }
  .row-name { font-size: 22px; font-weight: 800; line-height: 1.25; }
  .row-opt { font-size: 20px; color: var(--muted); }
  .btn-remove { flex: none; min-height: 50px; padding: 0 14px; border: 2px solid #E8C4BF; border-radius: 12px; background: #fff; color: #B42318; font-size: 20px; font-weight: 800; }
  .row-foot { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .qty { display: flex; align-items: center; gap: 6px; padding: 4px; border-radius: 14px; background: var(--soft); }
  .qty-row .qty { background: #fff; }
  .qty-btn { width: 54px; height: 54px; border: 2px solid #CFC7BD; border-radius: 12px; background: #fff; font-size: 30px; font-weight: 800; line-height: 1; }
  .qty-btn:disabled { opacity: .35; cursor: default; }
  .qty-num { min-width: 44px; text-align: center; font-size: 24px; font-weight: 900; }
  .qty.big { padding: 8px; gap: 12px; }
  .qty.big .qty-btn { width: 76px; height: 76px; font-size: 40px; }
  .qty.big .qty-num { min-width: 90px; font-size: 40px; }
  .row-price { font-size: 23px; font-weight: 900; }
  .empty-emoji { font-size: 72px; line-height: 1; }

  /* ---------- 결제 ---------- */
  .amount-box { width: 100%; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--soft); border-radius: 16px; font-size: 21px; }
  .amount-box b { font-size: 30px; font-weight: 900; }
  .pay-list { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .pay-option { min-height: 88px; padding: 0 20px; display: flex; align-items: center; gap: 16px; background: #fff; border: 3px solid var(--line); border-radius: 18px; font-size: 25px; font-weight: 800; text-align: left; }
  .pay-option:active { background: var(--action-soft); border-color: var(--action); }
  .pay-emoji { font-size: 44px; line-height: 1; }
  .insert-stage { --ins: 120px; --card-h: 126px; position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .reader, .scanner { position: relative; z-index: 2; width: 250px; padding: 16px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; background: var(--bezel); border-radius: 16px; color: #fff; font-size: 20px; font-weight: 700; }
  .slot { width: 190px; height: 12px; border-radius: 6px; background: #000; box-shadow: inset 0 2px 4px rgba(255, 255, 255, .18); }
  .arrow { font-size: 40px; line-height: 1; color: var(--action); animation: up 1.2s ease-in-out infinite; }
  @keyframes up { 0%, 100% { transform: translateY(4px); } 50% { transform: translateY(-6px); } }
  .insert-stage:not(.step-ready) .arrow { visibility: hidden; }
  .arrow-down { position: absolute; left: 50%; top: calc(100% - var(--ins) + 6px); display: none; font-size: 36px; line-height: 1; color: var(--action); animation: down 1.2s ease-in-out infinite; }
  .step-remove .arrow-down { display: block; }
  @keyframes down { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 8px); } }
  .card { position: relative; z-index: 1; width: 200px; height: var(--card-h); padding: 14px 16px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; border: none; border-radius: 14px; background: linear-gradient(135deg, #2F6FDB, #1E3A8A); color: #fff; box-shadow: 0 6px 14px rgba(0, 0, 0, .2); }
  .card:disabled { cursor: default; }
  .card-chip { width: 40px; height: 30px; border-radius: 6px; background: linear-gradient(135deg, #F6D776, #C9A23A); }
  .card-name { font-size: 20px; font-weight: 800; }
  .card.inserting { animation: insert 1s ease-in forwards; }
  .card.inserted { transform: translateY(calc(-1 * var(--ins))); }
  .card.removing { animation: pull .7s ease-out; }
  @keyframes insert { to { transform: translateY(calc(-1 * var(--ins))); } }
  @keyframes pull { from { transform: translateY(calc(-1 * var(--ins))); } }
  .spinner { display: inline-block; vertical-align: -4px; width: 26px; height: 26px; border: 4px solid var(--line); border-top-color: var(--action); border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 완료 ---------- */
  .done-emoji { font-size: 34px; line-height: 1; vertical-align: -4px; }
  .done-msg { font-size: 24px; font-weight: 700; color: var(--muted); }
  .order-no { width: 100%; max-width: 320px; padding: 14px 10px 8px; display: flex; flex-direction: column; align-items: center; background: var(--action-soft); border: 4px solid var(--action); border-radius: 22px; }
  .order-no span { font-size: 22px; font-weight: 800; }
  .order-no b { font-size: 96px; font-weight: 900; line-height: 1.05; letter-spacing: 2px; color: var(--action); }
  .praise { font-size: 34px; font-weight: 900; color: var(--brand); }
  .steps { width: 100%; margin: 0; padding: 14px 16px 14px 46px; background: var(--soft); border-radius: 16px; text-align: left; font-size: 21px; display: flex; flex-direction: column; gap: 6px; }
  .steps li::marker { font-weight: 900; color: var(--action); }
  .board { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px; background: #1F2937; border-radius: 14px; }
  .board-col { padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: #111827; border-radius: 10px; }
  .board-head { font-size: 20px; font-weight: 800; color: #FDE68A; }
  .board-col.ready .board-head { color: #86EFAC; }
  .board-no { font-size: 28px; font-weight: 900; color: #fff; letter-spacing: 1px; }
  .board-no.mine { padding: 0 10px; border-radius: 8px; background: #FACC15; color: #111827; }

  /* 진동벨 */
  .pager-row { width: 100%; display: flex; align-items: center; gap: 14px; }
  .pager { position: relative; flex: none; width: 96px; height: 96px; display: grid; place-items: center; border: 6px solid #D6D3D1; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #44403C, #1C1917); }
  .pager::after { content: ''; position: absolute; inset: 6px; border: 3px solid rgba(248, 113, 113, .25); border-radius: 50%; }
  .pager-led { padding: 0 8px; border-radius: 6px; background: #0C0A09; color: #F87171; font-family: ui-monospace, Consolas, monospace; font-size: 28px; font-weight: 900; }
  .pager.buzz { animation: buzz .2s linear infinite; }
  .pager.buzz::after { border-color: #EF4444; box-shadow: 0 0 16px #EF4444; }
  @keyframes buzz { 0% { transform: translateX(-3px) rotate(-4deg); } 50% { transform: translateX(3px) rotate(4deg); } 100% { transform: translateX(-3px) rotate(-4deg); } }
  .pager-wait { width: 100%; padding: 12px; display: flex; align-items: center; gap: 14px; background: var(--soft); border-radius: 16px; text-align: left; }
  .pager-msg { font-size: 22px; font-weight: 800; }
  .pager-msg.on { color: #B42318; }

  /* ---------- 병원 ---------- */
  .hosp-menu { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .hosp-btn { min-height: 96px; padding: 12px 18px; display: flex; align-items: center; gap: 16px; background: #fff; border: 3px solid var(--line); border-radius: 20px; text-align: left; }
  .hosp-btn:active { background: var(--action-soft); border-color: var(--action); }
  .hosp-emoji { font-size: 44px; line-height: 1; }
  .hosp-text { display: flex; flex-direction: column; }
  .hosp-text b { font-size: 28px; font-weight: 900; line-height: 1.25; }
  .hosp-text span { font-size: 20px; color: var(--muted); }
  .verify { gap: 12px; }
  .fields { width: 100%; display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 10px; }
  .fields.one { max-width: 260px; }
  .field { padding: 10px; display: flex; flex-direction: column; gap: 4px; background: #fff; border: 3px solid var(--line); border-radius: 16px; text-align: left; }
  .field.active { border-color: var(--action); background: var(--action-soft); }
  .field-label { font-size: 20px; font-weight: 800; line-height: 1.25; }
  .slots { display: flex; gap: 3px; }
  .slot-digit { flex: 1; height: 40px; display: grid; place-items: center; border-bottom: 3px solid #CFC7BD; font-size: 25px; font-weight: 900; }
  .slot-digit.cursor { border-bottom-color: var(--action); }
  .field-ref { font-size: 20px; color: var(--muted); }
  .field-ref b { color: var(--ink); letter-spacing: 1px; }
  .field-ref b i { font-style: normal; color: var(--action); text-decoration: underline; text-underline-offset: 3px; }
  .keypad { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .key { min-height: 58px; background: #fff; border: 2px solid #CFC7BD; border-radius: 14px; font-size: 28px; font-weight: 800; }
  .key:active { background: var(--action-soft); }
  .key.fn { background: var(--soft); font-size: 22px; }
  .key.ok { background: var(--action); border-color: var(--action); color: #fff; font-size: 22px; }
  .key.ok.is-off { background: var(--off-bg); border-color: var(--off-bg); color: var(--off-ink); }

  .terms { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--soft); border: 2px solid var(--line); border-radius: 14px; font-size: 20px; }
  .terms b { display: inline-block; min-width: 88px; }
  .check-row { min-height: 66px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; background: #fff; border: 3px solid var(--line); border-radius: 16px; text-align: left; font-size: 21px; font-weight: 700; }
  .check-row.all { font-size: 23px; font-weight: 900; }
  .check-row[aria-pressed="true"] { border-color: var(--action); background: var(--action-soft); }
  .check-row.next { box-shadow: 0 0 0 3px var(--action); }
  .check-box { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border: 3px solid #A8A29E; border-radius: 8px; color: transparent; font-weight: 900; }

/* ----- 국기 그림 (Windows에서는 국기 이모지가 안 보여서 직접 그림) ----- */
function starPoints(cx, cy, outer, inner, n = 5, rot = -90) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? inner : outer;
    const a = (rot + i * 180 / n) * Math.PI / 180;
    pts.push(`${(cx + r * Math.cos(a)).toFixed(2)},${(cy + r * Math.sin(a)).toFixed(2)}`);
  }
  return pts.join(' ');
}
function trigram(cx, cy, angle, pattern) {
  return `<g transform="translate(${cx} ${cy}) rotate(${angle})" fill="#000">${pattern.map((solid, i) => {
    const y = (i - 1) * 3 - 0.9;
    return solid ? `<rect x="-5" y="${y}" width="10" height="1.8"/>` : `<rect x="-5" y="${y}" width="4.3" height="1.8"/><rect x="0.7" y="${y}" width="4.3" height="1.8"/>`;
  }).join('')}</g>`;
}

// 받침 보고 조사 고르기 (한국어 문장에만 씀)
function hasBatchim(word) {
  const w = String(word);
  const code = w.charCodeAt(w.length - 1);
  if (code >= 0x30 && code <= 0x39) return '013678'.includes(w.slice(-1));
  if (code < 0xAC00 || code > 0xD7A3) return false;
  return (code - 0xAC00) % 28 !== 0;
}
const pick = (word, withB, withoutB) => (hasBatchim(word) ? withB : withoutB);
const josa = (word, withB, withoutB) => word + pick(word, withB, withoutB);
function pickRo(word) {
  const w = String(word);
  const code = w.charCodeAt(w.length - 1);
  if (code >= 0xAC00 && code <= 0xD7A3 && (code - 0xAC00) % 28 === 8) return '로';
  return hasBatchim(w) ? '으로' : '로';
}

const pad2 = n => String(n).padStart(2, '0');

const findItem = id => store.menu.find(m => m.id === id);

const emptyCustom = () => ({ add: [], remove: [] });

const ingLabel = id => [...store.ingredients.add, ...store.ingredients.remove].find(x => x.id === id).label;

function defaultChoices(item) {
  const choices = {};
  item.options.forEach(g => {
    const def = store.optionGroups[g].choices.find(c => c.default);
    if (def) choices[g] = def.id;
  });
  return choices;
}
function isGroupVisible(item, groupId, choices) {
  const cond = store.optionGroups[groupId].showIf;
  if (!cond || !item.options.includes(cond.group)) return true;
  return choices[cond.group] === cond.choice;
}
const visibleGroups = (item, choices) => item.options.filter(g => isGroupVisible(item, g, choices));

function variantFor(item, choices = {}, custom = null) {
  const cold = !!(item.art && item.art.cold);
  const temp = item.options.includes('temp') && choices.temp ? choices.temp : (cold ? 'ice' : 'hot');
  return { temp, custom };
}
function artSVG(item, variant = variantFor(item)) {
  const a = item.art;
  if (a && ART[a.kind]) return ART[a.kind](a, variant);
  return `<span class="art-emoji" aria-hidden="true">${item.emoji || '🍽️'}</span>`;
}
function logoHTML() {
  if (store) return artSVG({ art: store.logoArt, options: [] }, { temp: 'hot' });
  return `<span aria-hidden="true">${HOSPITAL.emoji}</span>`;
}

const setPart = (list, id) => list.find(x => x.id === id) || { extra: 0 };
const promoFor = itemId => (store.promo && store.promo.itemId === itemId ? store.promo : null);
const setBasePrice = item => item.price + store.set.price - (promoFor(item.id) ? promoFor(item.id).setDiscount : 0);
function unitPriceOf({ itemId, choices = {}, set = null, custom = null }) {
  const item = findItem(itemId);
  let price = item.price + visibleGroups(item, choices).reduce((sum, g) => {
    const c = choices[g] && findChoice(g, choices[g]);
    return sum + (c ? c.price : 0);
  }, 0);
  if (set && store.set) {
    price = setBasePrice(item) + setPart(store.set.sizes, set.size).extra + setPart(store.set.sides, set.side).extra + setPart(store.set.drinks, set.drink).extra;
  }
  if (custom) price += custom.add.reduce((s, id) => s + (store.ingredients.add.find(x => x.id === id) || { price: 0 }).price, 0);
  return price;
}
function lineText(l) {
  const item = findItem(l.itemId);
  const parts = [];
  if (item.setable) {
    if (l.set) {
      const ice = l.set.ice && l.set.ice !== 'normal' ? `(${T(findChoice('ice', l.set.ice).cartText)})` : '';
      parts.push(`${T(labelOf(store.set.sizes, l.set.size))} · ${T(findItem(l.set.side).name)} · ${T(findItem(l.set.drink).name)}${ice}`);
    } else {
      parts.push(T('단품'));
    }
    if (l.custom) [...l.custom.add, ...l.custom.remove].forEach(id => parts.push(T(ingLabel(id))));
  }
  visibleGroups(item, l.choices).forEach(g => {
    const c = findChoice(g, l.choices[g]);
    if (c && (c.cartText || !c.default)) parts.push(T(c.cartText || c.label));
  });
  return parts.join(' · ');
}
const lineName = l => `${T(findItem(l.itemId).name)}${l.set ? ' ' + T('세트') : ''}`;
const cartCount = () => state.cart.reduce((s, l) => s + l.qty, 0);
const cartTotal = () => state.cart.reduce((s, l) => s + unitPriceOf(l) * l.qty, 0);
const qtyInCart = itemId => state.cart.filter(l => l.itemId === itemId).reduce((s, l) => s + l.qty, 0);
function summaryText() {
  const byName = new Map();
  state.cart.forEach(l => {
    const name = lineName(l);
    byName.set(name, (byName.get(name) || 0) + l.qty);
  });
  return [...byName].map(([name, q]) => msg('countItem', name, q)).join(', ');
}

  const x = a || emptyCustom();
  const y = b || emptyCustom();
  return sameList(x.add, y.add) && sameList(x.remove, y.remove);
};
function lineMatches(l, e) {
  if (l.itemId !== e.id) return false;
  if (e.choices && Object.entries(e.choices).some(([g, c]) => l.choices[g] !== c)) return false;
  if ('set' in e) {
    if (!e.set) { if (l.set) return false; }
    else {
      if (!l.set || l.set.side !== e.set.side || l.set.drink !== e.set.drink) return false;
      if ((l.set.size || 'regular') !== (e.set.size || 'regular')) return false;
      if (e.set.ice && l.set.ice !== e.set.ice) return false;
    }
  }
  if (findItem(l.itemId).setable && !sameCustom(l.custom, e.custom)) return false;
  return true;
}
const matchedQty = e => state.cart.filter(l => lineMatches(l, e)).reduce((s, l) => s + l.qty, 0);

/* =====================================================================
   7) 소리로 읽어 주기 (브라우저에 들어 있는 음성 읽기, 고른 언어로)
   ===================================================================== */
const speech = {
  supported: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined',
};
function voiceFor(code) {
  const voices = window.speechSynthesis.getVoices();
  const low = code.toLowerCase();
  return voices.find(v => v.lang && v.lang.toLowerCase().replace('_', '-') === low)
    || (code === 'zh-TW' && voices.find(v => /^zh[-_](hk|tw)/i.test(v.lang)))
    || voices.find(v => v.lang && v.lang.toLowerCase().startsWith(low.slice(0, 2)))
    || null;
}
function speak(text) {
  if (!speech.supported || !text) return;
  try {
    window.speechSynthesis.cancel();
    const plain = String(text).replace(/<[^>]+>/g, ' ').replace(/['‘’"“”「」]/g, '');
    const u = new SpeechSynthesisUtterance(plain);
    u.lang = curLang().speech;
    u.rate = 0.95;
    const v = voiceFor(curLang().speech);
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  } catch (e) { /* 읽기를 못 해도 화면은 그대로 씀 */ }
}
function stopSpeaking() {
  if (speech.supported) { try { window.speechSynthesis.cancel(); } catch (e) { /* 무시 */ } }
}

   ===================================================================== */
function loadDone() {
  try { return new Set(JSON.parse(localStorage.getItem(SAVE_KEY) || '[]')); } catch (e) { return new Set(); }
}
const doneMissions = loadDone();
function saveDone() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify([...doneMissions])); } catch (e) { /* 저장을 못 해도 연습은 계속 */ }
}

function evaluateMission(m) {
  const diffs = store ? evaluateOrder(m.expect) : evaluateHospital(m.expect);
  const seen = new Set();
  return diffs.filter(d => { const key = JSON.stringify(d); if (seen.has(key)) return false; seen.add(key); return true; });
}

function evaluateOrder(ex) {
  const out = [];
  if (ex.orderType && state.orderType !== ex.orderType) {
    out.push({ k: 'orderType', w: labelOf(store.orderTypes, ex.orderType), g: labelOf(store.orderTypes, state.orderType) });
  }
  (ex.items || []).forEach(e => {
    const item = findItem(e.id);
    const lines = state.cart.filter(l => l.itemId === e.id);
    const total = lines.reduce((s, l) => s + l.qty, 0);
    if (!total) { out.push({ k: 'missing', n: item.name }); return; }
    Object.entries(e.choices || {}).forEach(([g, c]) => {
      if (lines.some(l => l.choices[g] !== c)) out.push({ k: 'choice', n: item.name, l: findChoice(g, c).label });
    });
    if ('set' in e) {
      if (!e.set && lines.some(l => l.set)) out.push({ k: 'singleNotSet', n: item.name });
      if (e.set) {
        if (lines.some(l => !l.set)) out.push({ k: 'setNotSingle', n: item.name });
        const sets = lines.filter(l => l.set);
        const wantSize = e.set.size || 'regular';
        const badSize = sets.find(l => (l.set.size || 'regular') !== wantSize);
        if (badSize) out.push({ k: 'setSize', w: labelOf(store.set.sizes, wantSize), g: labelOf(store.set.sizes, badSize.set.size) });
        const badSide = sets.find(l => l.set.side !== e.set.side);
        if (badSide) out.push({ k: 'setSide', w: findItem(e.set.side).name, g: findItem(badSide.set.side).name });
        const badDrink = sets.find(l => l.set.drink !== e.set.drink);
        if (badDrink) out.push({ k: 'setDrink', w: findItem(e.set.drink).name, g: findItem(badDrink.set.drink).name });
        if (e.set.ice && sets.some(l => l.set.ice !== e.set.ice)) out.push({ k: 'setIce', l: findChoice('ice', e.set.ice).label });
      }
    }
    if (item.setable) {
      const want = e.custom || emptyCustom();
      lines.forEach(l => {
        const got = l.custom || emptyCustom();
        [...want.add, ...want.remove].filter(id => !got.add.includes(id) && !got.remove.includes(id))
          .forEach(id => out.push({ k: 'customMissing', l: ingLabel(id) }));
        [...got.add, ...got.remove].filter(id => !want.add.includes(id) && !want.remove.includes(id))
          .forEach(id => out.push({ k: 'customExtra', l: ingLabel(id) }));
      });
    }
    if (total !== e.qty) out.push({ k: 'qty', n: item.name, w: e.qty, g: total, u: unitOf(item) });
  });
  const wanted = new Set((ex.items || []).map(e => e.id));
  [...new Set(state.cart.filter(l => !wanted.has(l.itemId)).map(l => findItem(l.itemId).name))]
    .forEach(name => out.push({ k: 'extraItem', n: name }));
  if (ex.upsell === 'declined' && state.upsellResult === 'added') out.push({ k: 'upsell', s: store.upsell.skipLabel });
  return out;
}

function evaluateHospital(ex) {
  const H = HOSPITAL;
  const out = [];
  const compare = (list, want, got, what) => {
    if (want && got !== want) out.push({ k: 'pick', what, w: labelOf(list, want), g: labelOf(list, got) });
  };
  compare(H.visits, ex.visit, state.visit, '방문 구분');
  compare(H.idMethods, ex.idMethod, state.idc.method, '본인 확인 방법');
  compare(H.symptoms, ex.symptom, state.symptom, '증상');
  compare(H.depts, ex.dept, state.dept, '진료과');
  compare(H.installments, ex.installment, state.installment, '할부');
  compare(H.certificates, ex.cert, state.cert, '서류');
  if (ex.certVisit && state.certVisit !== ex.certVisit) out.push({ k: 'pickVisit', w: ex.certVisit, g: state.certVisit });
  if (ex.copies && state.copies !== ex.copies) out.push({ k: 'copies', w: ex.copies, g: state.copies });
  Object.entries(ex.docs || {}).forEach(([id, want]) => {
    const doc = H.docs.find(d => d.id === id);
    if (!!state.docs[id] !== want) out.push({ k: want ? 'docYes' : 'docNo', l: doc.label });
  });
  return out;
}

function fmtDiff(x) {
  switch (x.k) {
    case 'orderType': return msg('dOrderType', T(x.w), T(x.g));
    case 'missing': return msg('dMissing', T(x.n));
    case 'choice': return msg('dChoice', T(x.n), T(x.l));
    case 'singleNotSet': return msg('dSingleNotSet', T(x.n));
    case 'setNotSingle': return msg('dSetNotSingle', T(x.n));
    case 'setSize': return msg('dSetSize', T(x.w), T(x.g));
    case 'setSide': return msg('dSetSide', T(x.w), T(x.g));
    case 'setDrink': return msg('dSetDrink', T(x.w), T(x.g));
    case 'setIce': return msg('dSetIce', T(x.l));
    case 'customMissing': return msg('dCustomMissing', T(x.l));
    case 'customExtra': return msg('dCustomExtra', T(x.l));
    case 'qty': return msg('dQty', T(x.n), x.w, x.g, T(x.u));
    case 'extraItem': return msg('dExtraItem', T(x.n));
    case 'upsell': return msg('dUpsell', T(x.s));
    case 'pick': return msg('dPick', T(x.what), T(x.w), T(x.g));
    case 'pickVisit': return msg('dPick', T('진료 날짜'), visitLabel(findVisit(x.w)), visitLabel(findVisit(x.g)));
    case 'copies': return msg('dCopies', x.w, x.g);
    case 'docYes': return msg('dDocYes', T(x.l));
    case 'docNo': return msg('dDocNo', T(x.l));
  }
  return '';
}

const KEYPADS = {
  verify: {
    data: () => state.verify,
    fields: () => [
      { id: 'birth', label: '생년월일', target: HOSPITAL.patient.birth },

  },
};
const keypadDone = name => KEYPADS[name].fields().every(f => KEYPADS[name].data()[f.id] === f.target);

function keypadHTML(name) {
  const kp = KEYPADS[name];
  const data = kp.data();
  const fields = kp.fields();
  const done = keypadDone(name);
  const fieldHTML = f => {
    const typed = data[f.id];
    const active = data.field === f.id;
    const slots = [...f.target].map((_, i) => `<span class="slot-digit${active && i === typed.length ? ' cursor' : ''}">${typed[i] || ''}</span>`).join('');
    const ref = [...f.target].map((d, i) => (i === typed.length && active ? `<i>${d}</i>` : d)).join('');
    return `
      <button class="field${active ? ' active' : ''}" data-action="field" data-arg="${f.id}" aria-label="${esc(msg('fieldAria', T(f.label), typed.length))}">
        <span class="field-label">${esc(T(f.label))}</span>
        <span class="slots" aria-hidden="true">${slots}</span>
        <span class="field-ref">${esc(T('연습용'))} <b>${ref}</b></span>
      </button>`;
  };
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'del', '0', 'ok'];
  return `
    <div class="fields${fields.length === 1 ? ' one' : ''}" style="--cols:${fields.length}">${fields.map(fieldHTML).join('')}</div>
    <div class="keypad${once.keyWarn ? ' warn' : ''}">
      ${keys.map(k => {
        if (k === 'del') return `<button class="key fn" data-action="key-del">${esc(T('지움'))}</button>`;
        if (k === 'ok') return `<button class="key ok${done ? ' hint' : ' is-off'}" data-action="key-ok" aria-disabled="${!done}">${esc(T('확인'))}</button>`;
        return `<button class="key" data-action="key" data-arg="${k}">${k}</button>`;
      }).join('')}
    </div>`;
}
function keypadHelp(name) {
  const kp = KEYPADS[name];
  const data = kp.data();
  const f = kp.fields().find(x => data[x.id].length < x.target.length);
  if (!f) return '[data-action="key-ok"]';
  if (data.field !== f.id) return `[data-action="field"][data-arg="${f.id}"]`;
  return `[data-action="key"][data-arg="${f.target[data[f.id].length]}"]`;
}
function pressKey(d) {
  const kp = KEYPADS[state.screen];
  if (!kp) return;
  const data = kp.data();
  const fields = kp.fields();
  let f = fields.find(x => x.id === data.field) || fields[0];
  if (data[f.id].length >= f.target.length) {
    const next = fields.find(x => data[x.id].length < x.target.length);
    if (!next) { toast(T("번호를 다 눌렀어요. '확인'을 눌러 주세요")); return; }
    f = next;
    data.field = next.id;
  }
  const want = f.target[data[f.id].length];
  if (d !== want) {
    once.keyWarn = true;
    render();
    toast(msg('nextDigit', want));
    return;
  }
  data[f.id] += d;
  if (data[f.id].length === f.target.length) {
    const next = fields.find(x => data[x.id].length < x.target.length);
    if (next) data.field = next.id;
  }
  render();
}
function deleteKey() {
  const kp = KEYPADS[state.screen];
  if (!kp) return;
  const data = kp.data();
  const fields = kp.fields();
  let f = data.field;
  if (!data[f].length) {
    const i = fields.findIndex(x => x.id === f);
    if (i > 0) { f = fields[i - 1].id; data.field = f; }
  }
  data[f] = data[f].slice(0, -1);
  render();
}
function confirmKey() {
  if (keypadDone(state.screen)) { goNext(); return; }
  toast(T('연습용 번호를 끝까지 눌러 주세요'));
}

    help: ex => {
      const back = '.kiosk-nav [data-action="back"]';
      if (!state.cart.length) return back;
      const items = ex.items || [];
      const wrong = state.cart.find(l => !items.some(e => lineMatches(l, e)));
      if (wrong) return `[data-action="remove"][data-arg="${CSS.escape(wrong.key)}"]`;
      for (const e of items) {
        const q = matchedQty(e);
        const line = state.cart.find(l => lineMatches(l, e));
        if (q > e.qty) return `[data-action="dec"][data-arg="${CSS.escape(line.key)}"]`;
        if (q < e.qty) return line ? `[data-action="inc"][data-arg="${CSS.escape(line.key)}"]` : back;
      }
      return '[data-action="pay"]';
    },
  },

const SHEETS = {
  option: {
    render: () => {
      const sh = state.sheet;
      const item = findItem(sh.itemId);
      const groups = visibleGroups(item, sh.choices);
      const miss = missingGroup();
      const scale = sh.choices.size === 'large' ? 1.08 : sh.choices.size === 'regular' ? 0.88 : 1;
      return `
        <div class="sheet-body" data-scroll="option-${item.id}">
          ${sheetHead(item, won(item.price), variantFor(item, sh.choices), scale)}
          ${groups.some(g => store.optionGroups[g].required) ? `<p class="sheet-help">${msg('reqHelp')}</p>` : ''}
          ${groups.length ? groups.map(g => groupHTML(item, g, miss)).join('') : `<p class="no-option">${E('이 메뉴는 고를 것이 없어요.')}</p>`}
          <div class="qty-row"><span class="qty-label">${E('수량')}</span>${qtyHTML(sh.qty, 'sheet-dec', 'sheet-inc', '', T(item.name))}</div>
        </div>
        <div class="sheet-foot">
          <button class="btn btn-secondary" data-action="sheet-close">${E('취소')}</button>
          <button class="btn btn-primary${miss ? ' is-off' : ' hint'}" data-action="option-add" aria-disabled="${!!miss}">${E('담기')} · ${won(unitPriceOf(sh) * sh.qty)}</button>
        </div>`;
    },
    guide: () => {
      const g = missingGroup();
      return g ? T(store.optionGroups[g].guide) : T("다 고르셨으면 '담기'를 눌러 보세요");
    },
    help: ex => {
      const sh = state.sheet;
      const item = findItem(sh.itemId);
      const e = (ex.items || []).find(x => x.id === item.id);
      if (!e) return '[data-action="sheet-close"]';
      for (const g of visibleGroups(item, sh.choices)) {
        const want = e.choices && e.choices[g];
        if (want && sh.choices[g] !== want) return `[data-action="choose"][data-arg="${g}:${want}"]`;
        if (!want && store.optionGroups[g].required && !sh.choices[g]) return `[data-action="choose"][data-arg="${g}:${store.optionGroups[g].choices[0].id}"]`;
      }
      const remaining = Math.max(1, e.qty - matchedQty(e));
      if (sh.qty < remaining) return '[data-action="sheet-inc"]';

        ${g.hint ? `<span class="opt-hint">${E(g.hint)}</span>` : ''}
      </legend>
      <div class="opt-choices" style="--cols:${Math.min(g.choices.length, 3)}">
        ${g.choices.map(c => {
          const sel = sh.choices[groupId] === c.id;
          return `
          <button class="opt${sel ? ' selected' : ''}" aria-pressed="${sel}" data-action="choose" data-arg="${groupId}:${c.id}">
            ${optionIcon(item, g, c)}
            <span class="opt-label">${E(c.label)}</span>
            ${c.price ? `<span class="opt-price">+${won(c.price)}</span>` : ''}
            ${sel ? '<span class="opt-check" aria-hidden="true">✓</span>' : ''}
          </button>`;
        }).join('')}

    </fieldset>`;
}
function optionIcon(item, group, choice) {
  if (group.icon === 'temp') return `<span class="opt-icon">${artSVG(item, { temp: choice.id })}</span>`;
  if (group.icon === 'size') return `<span class="opt-icon" style="--s:${choice.iconScale || 1}">${artSVG(item, variantFor(item, state.sheet.choices))}</span>`;
  return '';
}

   ===================================================================== */
const guideText = () => (state.sheet ? SHEETS[state.sheet.type].guide() : SCREENS[state.screen].guide());

function render() {
  const screenEl = $('#screen');
  const kiosk = $('#kiosk');
  const screenChanged = screenEl.dataset.screen !== state.screen;
  if (screenChanged) hideToast();

  const scrolls = {};
  if (!screenChanged) $$('[data-scroll]', screenEl).forEach(el => { scrolls[el.dataset.scroll] = el.scrollTop; });

  const active = document.activeElement;
  const focusInKiosk = !!active && active !== document.body && kiosk.contains(active);
  let focusSel = null;
  if (focusInKiosk && active.dataset && active.dataset.action) {
    focusSel = `[data-action="${active.dataset.action}"]` +
      (active.dataset.arg != null ? `[data-arg="${CSS.escape(active.dataset.arg)}"]` : ':not([data-arg])');
  }

  screenEl.dataset.screen = state.screen;
  screenEl.innerHTML = SCREENS[state.screen].render() + (state.sheet ? sheetHTML() : '');
  if (screenChanged && once.enter && screenEl.firstElementChild) {
    screenEl.firstElementChild.classList.add(once.enter === 'back' ? 'enter-back' : 'enter');
  }
  $$('[data-scroll]', screenEl).forEach(el => { if (el.dataset.scroll in scrolls) el.scrollTop = scrolls[el.dataset.scroll]; });

  renderChrome();

  if (once.sheetOpened) {
    const first = $('.sheet button:not([disabled])', screenEl);
    if (first) first.focus({ preventScroll: true });
  } else if (focusInKiosk) {
    const target = focusSel && kiosk.querySelector(focusSel);
    if (target && !target.disabled) target.focus({ preventScroll: true });
    else screenEl.focus({ preventScroll: true });
  }
  Object.keys(once).forEach(k => { once[k] = false; });
}

function renderChrome() {
  const text = guideText();
  const guideTextEl = $('#guideText');
  if (guideTextEl.textContent !== text) {
    guideTextEl.textContent = text;
    const box = $('#guide');
    box.classList.remove('flash');
    void box.offsetWidth;
    box.classList.add('flash');
    if (app.sound && app.view === 'practice') speak(text);
  }

  const badge = $('#orderBadge');
  let badgeText = '';
  if (store) {
    const type = store.orderTypes.find(t => t.id === state.orderType);
    if (type && state.screen !== 'start') badgeText = T(type.badge);
  } else if (state.screen !== 'hospitalStart') {
    badgeText = T(labelOf(HOSPITAL.menu, P().hospital));
  }
  badge.hidden = !badgeText;
  badge.textContent = badgeText;

  const first = state.screen === firstScreen();
  const lockedSheet = state.sheet && LOCKED_SHEETS.includes(state.sheet.type);
  const backBtn = $('.kiosk-nav [data-action="back"]');
  const homeBtn = $('.kiosk-nav [data-action="home"]');
  backBtn.disabled = ((first || isFinal()) && !state.sheet) || isLocked() || !!lockedSheet;
  homeBtn.disabled = (first && !state.sheet) || isLocked();
  backBtn.classList.toggle('hint', state.screen === 'cart' && !state.cart.length && !state.sheet);
}
